<div class="admin-container">

  <aside class="sidebar shadow">

    <div class="sidebar-header" routerLink="/admin" style="cursor: pointer;" title="Ir al Inicio">
      <div class="brand">
        <i class="fas fa-dumbbell me-2"></i> GymSystem
      </div>
    </div>

    <nav class="sidebar-nav">

      <div class="nav-section">GESTIÓN DE SOCIOS</div>

      <a routerLink="/admin/usuarios" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link">
        <i class="fas fa-users icon"></i> Listar Usuarios
      </a>
      <a routerLink="/admin/usuarios/crear" routerLinkActive="active" class="nav-link">
        <i class="fas fa-user-plus icon"></i> Nuevo Usuario
      </a>

      <div class="nav-section mt-3">MEMBRESÍAS</div>

      <a routerLink="/admin/suscripcion/renovar-suscripcion" routerLinkActive="active" class="nav-link">
        <i class="fas fa-sync-alt icon"></i> Renovar / Vender
      </a>
      <a routerLink="/admin/suscripcion/historial" routerLinkActive="active" class="nav-link">
        <i class="fas fa-history icon"></i> Historial de Suscripciones
      </a>
      <a routerLink="/admin/gestionar-planes" routerLinkActive="active" class="nav-link">
        <i class="fas fa-tags icon"></i> Planes y Precios
      </a>

      <div class="nav-section mt-3">ANÁLISIS</div>

      <a routerLink="/admin/reportes" routerLinkActive="active" class="nav-link">
        <i class="fas fa-chart-line icon"></i> Reportes y Estadísticas
      </a>

    </nav>

    <div class="sidebar-footer">
      <small>By Josue</small>
    </div>
  </aside>

  <main class="main-content">

    <header class="topbar shadow-sm d-flex justify-content-between align-items-center px-4">

      <h4 class="page-title mb-0">Panel de Administración</h4>

      <div class="d-flex gap-2">

        <a routerLink="/ingreso" target="_blank" class="btn btn-primary btn-sm d-flex align-items-center shadow-sm">
          <i class="fas fa-desktop me-2"></i> Pantalla de Ingreso
        </a>

        <button class="btn btn-outline-danger btn-sm d-flex align-items-center" (click)="cerrarSesion()">
          <i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión
        </button>

      </div>

    </header>

    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>

  </main>

</div>
